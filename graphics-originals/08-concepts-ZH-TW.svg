<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768">
  <rect width="1200" height="768" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
  </defs>
  <style>
    .box { stroke: none; rx: 5; }
    .dark { fill: #315c7b; }
    .blue { fill: #169bc9; }
    .cyan { fill: #58bec7; }
    .orange { fill: #f8ae4b; }
    .red { fill: #f06e61; }
    .pink { fill: #f7d8d3; }
    .lav { fill: #d9d8e8; }
    .text { font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif; fill: #fff; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .darktext { font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif; fill: #111; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .line { fill: none; stroke-width: 2.2; marker-end: url(#arrow); }
    .dblue { stroke: #2f5b7c; }
    .scyan { stroke: #12aab5; }
    .sorange { stroke: #f08705; }
    .sred { stroke: #e85642; }
    .sblue { stroke: #1699d3; }
    .spink { stroke: #f19c99; }
    .slav { stroke: #cda2be; }
  </style>

  <!-- central concept -->
  <rect class="box dark" x="482" y="311" width="190" height="86"/>
  <text class="text" x="577" y="337"><tspan x="577">橫切關注點</tspan><tspan x="577" dy="21">或概念</tspan></text>

  <!-- left: safety and security -->
  <rect class="box red" x="205" y="315" width="143" height="58"/>
  <text class="text" x="276" y="339"><tspan x="276">安全與</tspan><tspan x="276" dy="19">資訊安全</tspan></text>
  <path class="line dblue" d="M482 348 L348 347"/>
  <rect class="box red" x="73" y="181" width="119" height="47"/><text class="text" x="132" y="201"><tspan x="132">授權與</tspan><tspan x="132" dy="17">身分驗證</tspan></text>
  <rect class="box red" x="42" y="263" width="104" height="47"/><text class="text" x="94" y="283"><tspan x="94">資訊安全</tspan></text>
  <rect class="box red" x="0" y="335" width="148" height="48"/><text class="text" x="74" y="355"><tspan x="74">安全與資安</tspan><tspan x="74" dy="17">標準合規</tspan></text>
  <rect class="box red" x="39" y="408" width="109" height="47"/><text class="text" x="93" y="438">安全性</text>
  <rect class="box red" x="83" y="466" width="100" height="47"/><text class="text" x="133" y="494"><tspan x="133">威脅分析</tspan></text>
