  <rect class="box cyan" x="1051" y="343" width="149" height="49"/><text class="text" x="1125" y="364"><tspan x="1125">整合、</tspan><tspan x="1125" dy="18">通訊</tspan></text>
  <rect class="box cyan" x="1060" y="416" width="125" height="49"/><text class="text" x="1122" y="437"><tspan x="1122">例外與</tspan><tspan x="1122" dy="18">錯誤處理</tspan></text>
