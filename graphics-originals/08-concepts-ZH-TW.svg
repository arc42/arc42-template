  <!-- patterns -->
  <rect class="box orange" x="254" y="202" width="99" height="45"/><text class="text" x="304" y="230">模式</text>
  <rect class="box orange" x="165" y="105" width="100" height="47"/><text class="text" x="215" y="125"><tspan x="215">架構模式</tspan></text>
  <rect class="box orange" x="226" y="43" width="139" height="49"/><text class="text" x="296" y="63"><tspan x="296">設計與編碼</tspan><tspan x="296" dy="18">模式</tspan></text>
  <path class="line dblue" d="M482 327 L353 226"/><path class="line sorange" d="M275 202 L248 152"/><path class="line sorange" d="M331 202 L330 92"/>

