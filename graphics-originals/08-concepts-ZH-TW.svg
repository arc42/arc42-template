  <rect class="box pink" x="654" y="723" width="132" height="45"/><text class="darktext" x="720" y="750">災害復原</text>
  <path class="line dblue" d="M577 397 L482 535"/><path class="line spink" d="M559 553 L693 552"/><path class="line spink" d="M559 568 L700 614"/><path class="line spink" d="M559 580 L693 676"/><path class="line spink" d="M443 601 L450 697"/><path class="line spink" d="M518 601 L582 687"/><path class="line spink" d="M545 601 L720 723"/><path class="line spink" d="M420 601 L357 623"/><path class="line spink" d="M280 720 L390 720" marker-start="url(#arrow-start)"/>

  <!-- under the hood -->
