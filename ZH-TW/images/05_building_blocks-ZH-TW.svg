    .lane-arrow { stroke: #333333; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    .refinement-line { stroke: #333333; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
    .lane-figure { stroke: #333333; stroke-width: 2; fill: none; }
    .lane-external { font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif; fill: #111111; font-size: 16px; }
