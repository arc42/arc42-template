    .arrow { stroke: #333; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    .solid-arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dot { fill: #ffffff; }
    .lane-rule { stroke: #777777; stroke-width: 1; stroke-dasharray: 5 5; }
    .lane-label { font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif; fill: #111111; font-size: 16px; font-weight: 700; }
