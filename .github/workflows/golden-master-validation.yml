# Validates the golden master with the arc42 generator (https://github.com/arc42/arc42-generator):
# balanced ifdef/endif, help blocks wrapped in their conditional, the feature attribute
# (:arc42help:) set, images present, version.properties complete, chapters and help blocks
# consistent with EN. Every problem is shown as annotation on its file and line in the pull
# request, and a report with the counts per language is written to the job summary.
# Errors fail the check; warnings (differences from EN) do not.
name: Golden master validation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the template
        uses: actions/checkout@v4

      - name: Check out the generator
        uses: actions/checkout@v4
        with:
          repository: arc42/arc42-generator
          path: .arc42-generator

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate and generate the templates
        working-directory: .arc42-generator
        run: |
          # the generator reads the golden master from arc42-template/: point it at this checkout,
          # so the reported paths are the paths of this repository
          rm -rf arc42-template
          ln -s "$GITHUB_WORKSPACE" arc42-template
          ./gradlew --no-daemon --quiet templates
